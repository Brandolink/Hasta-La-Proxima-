<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 razones por las que te amo ❤️</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  background:linear-gradient(135deg,#ffd6e7,#fff0f5,#ffd1dc);
  color:#5a1830;
}
.screen{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  padding:30px 16px;
  position:relative;
}
.screen.active{display:flex}
.card{
  width:min(900px,94vw);
  background:rgba(255,255,255,.88);
  border-radius:30px;
  padding:38px;
  box-shadow:0 20px 60px rgba(120,20,60,.18);
  text-align:center;
  position:relative;
  z-index:2;
}
h1{font-size:clamp(2rem,5vw,4rem);margin-bottom:12px}
.subtitle{font-size:1.1rem;color:#8c4660;margin-bottom:28px}
.reasons{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:12px;
  max-height:62vh;
  overflow:auto;
  padding:5px;
  text-align:left;
}
.reason{
  background:#fff5f8;
  border:1px solid #ffd0de;
  border-radius:16px;
  padding:14px 16px;
  transition:.2s;
}
.reason:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(190,50,100,.12)}
.reason b{color:#d52f68;margin-right:6px}
button{
  border:0;
  border-radius:999px;
  padding:15px 30px;
  font-size:1.05rem;
  font-weight:bold;
  cursor:pointer;
  transition:transform .2s,box-shadow .2s;
}
.next,.yes{background:#e93470;color:white;box-shadow:0 8px 20px rgba(233,52,112,.3)}
.next{margin-top:25px}
button:hover{transform:scale(1.05)}
.question{
  font-size:clamp(2rem,6vw,4.5rem);
  margin-bottom:15px;
}
.question-sub{font-size:1.2rem;margin-bottom:35px}
.buttons{
  position:relative;
  height:150px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:25px;
}
.no{
  background:#eee;
  color:#555;
  position:relative;
}
.final-heart{font-size:7rem;animation:pulse 1s infinite}
.final h1{color:#d52f68}
@keyframes pulse{50%{transform:scale(1.15)}}
.heart{
  position:fixed;
  bottom:-30px;
  font-size:20px;
  animation:floatUp linear forwards;
  opacity:.75;
  z-index:1;
  pointer-events:none;
}
@keyframes floatUp{
  to{transform:translateY(-110vh) rotate(360deg);opacity:0}
}
@media(max-width:600px){
 .card{padding:25px 18px}
 .reasons{grid-template-columns:1fr;max-height:58vh}
 .buttons{height:180px}
}
.final-photo{width:min(700px,100%);max-height:65vh;object-fit:cover;border-radius:24px;margin:20px auto 22px;display:block;box-shadow:0 14px 35px rgba(120,20,60,.22);border:5px solid white;}
</style>
</head>
<body>

<section id="screen1" class="screen active">
  <div class="card">
    <h1>100 razones por las que te amo ❤️</h1>
    <p class="subtitle">Podría escribir mil más, pero empecemos con estas...</p>
    <div id="reasons" class="reasons"></div>
    <button class="next" onclick="showQuestion()">Siguiente ❤️</button>
  </div>
</section>

<section id="screen2" class="screen">
  <div class="card">
    <div class="question">¿Quieres ser mi novia? 💍❤️</div>
    <p class="question-sub">Después de leer todas mis razones, espero que tu respuesta sea la que estoy esperando... 🥹</p>
    <div class="buttons">
      <button class="yes" onclick="sayYes()">SÍ ❤️</button>
      <button id="noBtn" class="no">NO 😈</button>
    </div>
  </div>
</section>

const reasonsBox = document.getElementById("reasons");
reasons.forEach((r,i)=>{
  const div=document.createElement("div");
  div.className="reason";
  div.innerHTML=`<b>${i+1}.</b>${r}`;
  reasonsBox.appendChild(div);
});

function showQuestion(){
  document.getElementById("screen1").classList.remove("active");
  document.getElementById("screen2").classList.add("active");
  startHearts();
}

function sayYes(){
  document.getElementById("screen2").classList.remove("active");
  document.getElementById("screen3").classList.add("active");
  for(let i=0;i<35;i++) setTimeout(createHeart,i*80);
}

const noBtn=document.getElementById("noBtn");
let noCount=0;

function moveNo(){
  noCount++;
  const container=document.querySelector(".buttons");
  const maxX=Math.max(20,container.clientWidth/2-70);
  const maxY=65;
  const x=(Math.random()*2-1)*maxX;
  const y=(Math.random()*2-1)*maxY;
  noBtn.style.position="absolute";
  noBtn.style.left="50%";
  noBtn.style.top="50%";
  noBtn.style.transform=`translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  if(noCount>2) noBtn.textContent="¿Segura? 😏";
  if(noCount>5) noBtn.textContent="¡No puedes escapar! 😂";
  if(noCount>8) noBtn.textContent="Mejor dale a SÍ ❤️";
}
noBtn.addEventListener("mouseenter",moveNo);
noBtn.addEventListener("touchstart",(e)=>{e.preventDefault();moveNo()});
noBtn.addEventListener("click",(e)=>{e.preventDefault();moveNo()});

function createHeart(){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent=["❤️","💕","💗","💖","💘"][Math.floor(Math.random()*5)];
  h.style.left=Math.random()*100+"vw";
  h.style.animationDuration=(4+Math.random()*5)+"s";
  h.style.fontSize=(15+Math.random()*25)+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),10000);
}
function startHearts(){
  for(let i=0;i<12;i++) setTimeout(createHeart,i*250);
  setInterval(createHeart,900);
}
